# Completeness ---------------------------------------------------------------

- name: bronze_rows_missing_from_silver
  dimension: completeness
  severity: error
  description: Bronze decisions absent from Silver, per source.
  sql: |
    SELECT b.source, count(*) FILTER (WHERE s.external_id IS NULL) AS value
    FROM bronze.raw_documents b
    LEFT JOIN silver.decisions s
      ON s.source = b.source AND s.external_id = b.external_id
    WHERE b.source IN ('judilibre', 'adlc-opendata')
    GROUP BY b.source;
  expect:
    judilibre: {op: "==", value: 0}
    adlc-opendata: {op: "==", value: 0}

- name: missing_decision_date
  dimension: completeness
  severity: error
  description: Silver decisions without a decision date, per source.
  sql: |
    SELECT source, count(*) FILTER (WHERE decision_date IS NULL) AS value
    FROM silver.decisions
    GROUP BY source;
  expect:
    default: {op: "==", value: 0}

- name: missing_decision_type_pct
  dimension: completeness
  severity: warning
  description: >-
    Percentage of Silver decisions without a decision type.
    Judilibre is known to be 100% (source type is always "other").
  sql: |
    SELECT source,
           round(100.0 * count(*) FILTER (WHERE decision_type IS NULL) / count(*), 2) AS value
    FROM silver.decisions
    GROUP BY source;
  expect:
    default: {op: "==", value: 0}
    judilibre: {op: "==", value: 100}

- name: empty_text
  dimension: completeness
  severity: warning
  description: >-
    Decisions without full text (empty or NULL), hence not searchable by content.
    30 known for the Autorité as of 25/09/2026, mostly recent merger decisions
    and 1990s documents.
  sql: |
    SELECT source, count(*) FILTER (WHERE text IS NULL OR btrim(text) = '') AS value
    FROM silver.decisions
    GROUP BY source;
  expect:
    default: {op: "==", value: 0}
    adlc-opendata: {op: "<=", value: 30}

- name: silver_rows_missing_from_index
  dimension: completeness
  severity: error
  description: >-
    Silver decisions missing from the index currently behind the alias (last run
    with alias_switched). Also detects a stale index after a Silver rebuild.
  sql: |
    WITH last_switch AS (
      SELECT max(run_id) AS run_id
      FROM search.index_stats
      WHERE alias_switched
    ),
    indexed AS (
      SELECT source, indexed_count
      FROM search.index_stats
      WHERE run_id = (SELECT run_id FROM last_switch)
    ),
    silver AS (
      SELECT source, count(*) AS n
      FROM silver.decisions
      GROUP BY source
    )
    SELECT source, coalesce(s.n, 0) - coalesce(i.indexed_count, 0) AS value
    FROM silver s
    FULL OUTER JOIN indexed i USING (source);
  expect:
    default: {op: "==", value: 0}
    judilibre: {op: "==", value: 0}
    adlc-opendata: {op: "==", value: 0}


# Validity -------------------------------------------------------------------

- name: impossible_decision_date
  dimension: validity
  severity: error
  description: Decision dates in the future, or before 1988 for the Autorité de la concurrence.
  sql: |
    SELECT source,
           count(*) FILTER (
             WHERE decision_date > current_date
                OR (source = 'adlc-opendata' AND decision_date < DATE '1988-01-01')
           ) AS value
    FROM silver.decisions
    GROUP BY source;
  expect:
    default: {op: "==", value: 0}

- name: findability_by_number
  dimension: validity
  severity: error
  description: Share of sampled decisions found in the top 10 by their exact number (latest evaluation).
  sql: |
    SELECT 'search' AS source, hit_at_10 AS value
    FROM search.findability_runs
    WHERE mode = 'number'
    ORDER BY run_id DESC
    LIMIT 1;
  expect:
    search: {op: "==", value: 1}

- name: findability_by_title_unambiguous
  dimension: validity
  severity: warning
  description: >-
    Share of sampled decisions with an unambiguous title found at rank 1 by their
    title (latest evaluation, title weight 2). Ambiguous titles are excluded: the
    source itself does not distinguish them.
  sql: |
    WITH last AS (
      SELECT max(eval_id) AS eval_id
      FROM search.findability_runs
      WHERE mode = 'title' AND title_boost = 2
    )
    SELECT 'search' AS source,
           round(avg(CASE WHEN rank = 1 THEN 1.0 ELSE 0 END), 4) AS value
    FROM search.findability_results
    WHERE eval_id = (SELECT eval_id FROM last)
      AND NOT ambiguous_title;
  expect:
    search: {op: ">=", value: 0.98}

# Uniqueness -----------------------------------------------------------------

- name: duplicate_decision_number
  dimension: uniqueness
  severity: warning
  description: >-
    Decision numbers used by more than one Silver row, for the Autorité
    (5 known, e.g. 17-A-05, published twice). Not applied to Judilibre: a
    pourvoi number identifies a case, which can produce several decisions
    (e.g. a QPC and the merits, the same day); see duplicate_ecli.
  sql: |
    SELECT 'adlc-opendata' AS source, count(*) AS value
    FROM (
      SELECT decision_number
      FROM silver.decisions
      WHERE source = 'adlc-opendata' AND decision_number IS NOT NULL
      GROUP BY decision_number
      HAVING count(*) > 1
    ) d;
  expect:
    adlc-opendata: {op: "<=", value: 5}

- name: duplicate_ecli
  dimension: uniqueness
  severity: warning
  description: >-
    ECLI identifiers used by more than one Judilibre decision in Silver. The ECLI
    identifies a single decision, unlike the pourvoi number.
  sql: |
    SELECT 'judilibre' AS source, count(*) AS value
    FROM (
      SELECT attributes->>'ecli'
      FROM silver.decisions
      WHERE source = 'judilibre' AND attributes->>'ecli' IS NOT NULL
      GROUP BY 1
      HAVING count(*) > 1
    ) d;
  expect:
    judilibre: {op: "==", value: 0}

# Consistency ----------------------------------------------------------------

- name: number_year_mismatch
  dimension: consistency
  severity: warning
  description: >-
    Autorité decisions whose date is impossible given their number: earlier than
    the number year, or more than one year later. A one-year gap is normal
    (a year's numbering runs into the first months of the next year).
    3 known as of 25/09/2026 (95-MC-06, 95-D-26, 96-D-03).
  sql: |
    WITH n AS (
      SELECT decision_date,
             left(decision_number, 2)::int
               + CASE WHEN left(decision_number, 2)::int >= 87 THEN 1900 ELSE 2000 END AS number_year
      FROM silver.decisions
      WHERE source = 'adlc-opendata'
        AND decision_number ~ '^\d{2}-'
    )
    SELECT 'adlc-opendata' AS source,
           count(*) FILTER (
             WHERE extract(year FROM decision_date)::int - number_year NOT IN (0, 1)
           ) AS value
    FROM n;
  expect:
    adlc-opendata: {op: "<=", value: 3}

# Freshness ------------------------------------------------------------------

- name: hours_since_last_success
  dimension: freshness
  severity: warning
  description: Hours since the last successful run of each pipeline step.
  sql: |
    SELECT source, round(extract(epoch FROM now() - max(finished_at)) / 3600) AS value
    FROM bronze.collection_runs
    WHERE status = 'success'
      AND source IN ('judilibre', 'adlc-opendata', 'adlc-scraper', 'silver', 'search', 'search-eval')
    GROUP BY source;
  expect:
    judilibre: {op: "<=", value: 168}
    adlc-opendata: {op: "<=", value: 168}
    adlc-scraper: {op: "<=", value: 168}
    silver: {op: "<=", value: 168}
    search: {op: "<=", value: 168}
    search-eval: {op: "<=", value: 168}

- name: site_decisions_missing_from_opendata
  dimension: freshness
  severity: warning
  description: Decisions seen on the Autorité website by the scraper but absent from the open data dataset.
  sql: |
    SELECT 'adlc-scraper' AS source, count(*) AS value
    FROM bronze.raw_documents s
    WHERE s.source = 'adlc-scraper'
      AND NOT EXISTS (
        SELECT 1 FROM bronze.raw_documents o
        WHERE o.source = 'adlc-opendata'
          AND rtrim(btrim(o.external_id), '/') = rtrim(btrim(s.external_id), '/')
      );
  expect:
    adlc-scraper: {op: "==", value: 0}
